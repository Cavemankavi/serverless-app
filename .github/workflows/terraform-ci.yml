name: Terraform CI

on:
  pull_request:
    branches:
      - main
    paths:
      - "infrastructure/**"

permissions:
  id-token: write
  contents: read

jobs:
  terraform-checks:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: infrastructure

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Format Check
        run: terraform fmt -check

      - name: Terraform Init
        run: terraform init -backend=false

      - name: Terraform Validate
        run: terraform validate

      - name: Inspect GitHub OIDC claims
        shell: bash
        run: |
          RESPONSE=$(curl -sS \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com")

          TOKEN=$(echo "$RESPONSE" | jq -r '.value')

          echo "$TOKEN" \
            | cut -d '.' -f2 \
            | tr '_-' '/+' \
            | awk '{l=length($0)%4; if(l==2)$0=$0"=="; else if(l==3)$0=$0"="; print}' \
            | base64 -d \
            | jq '{iss, aud, sub, repository, repository_id, repository_owner, repository_owner_id, ref, event_name}'